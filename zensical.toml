[project]
site_url = "https://kotlin.github.io/analysis-api/"
site_name = "Kotlin Analysis API"
site_description = "Official library for analyzing Kotlin code"
docs_dir = "website"
# site_author = "Your name"

# copyright = "Copyright &copy; 2026 Your name"

repo_url = "https://github.com/JetBrains/kotlin/tree/master/analysis"
repo_name = "Analysis API Sources"
# edit_uri = "edit/main/docs/"

nav = [
  { "Kotlin Analysis API" = "index.md" },
  { "Documentation" = [
    "topics/Fundamentals.md",
    "topics/Symbols.md",
    "topics/Types.md",
    "topics/Annotations.md",
    { "References and Calls" = [
      "topics/References-And-Calls.md",
      "topics/Resolution-Fundamentals.md",
      "topics/Resolving-Symbols.md",
      "topics/Resolving-Calls.md",
      "topics/Resolution-Candidates.md",
      "topics/Receivers.md",
      "topics/Legacy-Resolution-API.md"
    ] },
    { "Other" = [
      "topics/Java-Kotlin-Bridging.md",
      { "Diagnostics" = [
        "topics/Diagnostics.md",
        "topics/Legacy-Diagnostics-API.md",
      ] },
      "topics/In-memory-file-analysis.md",
      "topics/File-Compilation.md",
      "topics/Statistics.md",
    ] },
    { "Migration Guides" = [
      "topics/Migrating-Resolution-API.md",
      "topics/Migrating-Type-Creator.md",
    ] },
  ] },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
favicon = "images/kotlin-logo.png"
language = "en"
features = [
  "navigation.instant",
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  #    "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

logo = "images/kotlin-logo.png"

[project.theme.icon]
repo = "fontawesome/brands/github"
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = { }
admonition = { }
attr_list = { }
def_list = { }
footnotes = { }
md_in_html = { }
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = { }
pymdownx.caret = { }
pymdownx.details = { }
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = { }
pymdownx.keys = { }
pymdownx.magiclink = { }
pymdownx.mark = { }
pymdownx.smartsymbols = { }
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = { }

[[project.markdown_extensions.zensical.extensions.preview.configurations]]
targets.include = ["*"]
